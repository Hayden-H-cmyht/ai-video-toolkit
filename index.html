<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 视频工具箱 · avit</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">▶</span>
    <div>
      <h1>AI 视频工具箱 <small>avit</small></h1>
      <p class="sub">Whisper 字幕 · 批量转码 · 高光剪辑 · 清晰度增强</p>
    </div>
  </div>
  <div class="head-right">
    <span id="engineBadge" class="badge">引擎检测中…</span>
    <a id="onlineLink" class="ghost-link" href="#" target="_blank" rel="noopener">线上版</a>
  </div>
</header>

<div id="engineNote" class="note hidden"></div>

<nav id="tabs">
  <button class="tab active" data-f="convert">批量转格式</button>
  <button class="tab" data-f="subs">AI 字幕</button>
  <button class="tab" data-f="highlight">高光剪辑</button>
  <button class="tab" data-f="upscale">清晰度增强</button>
</nav>

<main>
  <!-- 输入 -->
  <section class="panel">
    <div class="panel-title">输入</div>
    <div id="localInputRow" class="row">
      <input id="inputPath" type="text" spellcheck="false"
             placeholder="输入视频/音频文件或文件夹路径，或点右侧浏览">
      <button id="btnBrowse" class="btn ghost">浏览…</button>
    </div>
    <div id="webInputRow" class="row hidden">
      <label class="filepick" for="inputFile">选择文件（在浏览器内处理，建议 ≤ 200MB / 短视频）</label>
      <input id="inputFile" type="file">
    </div>
  </section>

  <!-- 选项 -->
  <section class="panel">
    <div class="panel-title">选项</div>

    <div class="opts" data-f="convert">
      <label>预设
        <select id="cPreset">
          <option value="mp4">通用 MP4（H.264+AAC，兼容性最好）</option>
          <option value="small">压缩 MP4（&gt;720p 降到 720p，体积小）</option>
          <option value="remux">无损换壳（只改封装，秒级）</option>
          <option value="gif">GIF 动图（12fps / 480 宽）</option>
          <option value="mp3">提取音频 MP3</option>
        </select>
      </label>
      <label id="cGifSec" class="hidden">GIF 取前几秒 <input id="cGifSecN" type="number" value="10" min="1" max="60"></label>
      <label class="chk local-only"><input id="cRecursive" type="checkbox"> 递归子目录</label>
    </div>

    <div class="opts hidden" data-f="subs">
      <label>模型
        <select id="sModel">
          <option value="tiny">tiny（最快，中文错字多）</option>
          <option value="base">base（快）</option>
          <option value="small" selected>small（推荐，效果好）</option>
          <option value="medium">medium（质量高，慢）</option>
        </select>
      </label>
      <label>语言
        <select id="sLang">
          <option value="">自动检测</option>
          <option value="zh">中文</option>
          <option value="en">英文</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
        </select>
      </label>
      <label class="chk local-only"><input id="sBurn" type="checkbox"> 把字幕烧录进画面（重编码）</label>
      <p class="hint web-only hidden">浏览器版首次运行需下载模型：tiny ≈45MB / base ≈90MB / small ≈300MB，走 hf-mirror。烧录字幕仅桌面版支持。</p>
    </div>

    <div class="opts hidden" data-f="highlight">
      <label>取前 <input id="hTop" type="number" value="5" min="1" max="20"> 段</label>
      <label>单段 <input id="hMin" type="number" value="4" min="1" max="60"> ~
        <input id="hMax" type="number" value="30" min="5" max="120"> 秒</label>
      <label>能量阈值百分位 <input id="hPct" type="number" value="60" min="1" max="99">（越小越宽松）</label>
      <label class="chk"><input id="hNoReel" type="checkbox"> 不生成高光合集</label>
    </div>

    <div class="opts hidden" data-f="upscale">
      <label>目标
        <select id="uTo">
          <option value="2x">放大 2 倍</option>
          <option value="1080p">1080p</option>
          <option value="720p">720p</option>
          <option value="4x">放大 4 倍</option>
        </select>
      </label>
      <label class="chk local-only"><input id="uAI" type="checkbox"> AI 超分（Real-ESRGAN，慢，需显卡）</label>
      <label id="uTileWrap" class="hidden">显存分块
        <select id="uTile"><option value="2">2（默认）</option><option value="1">1（显存小）</option><option value="4">4</option></select>
      </label>
      <p class="hint web-only hidden">浏览器版只支持快速增强（lanczos+降噪+锐化）；AI 超分请用桌面版。</p>
    </div>
  </section>

  <div class="actions">
    <button id="btnRun" class="btn primary">开始处理</button>
    <button id="btnCancel" class="btn danger hidden">终止</button>
  </div>

  <!-- 任务 -->
  <section id="jobPanel" class="panel hidden">
    <div class="panel-title">任务 <span id="jobStatus" class="badge"></span>
      <span id="jobElapsed" class="dim"></span></div>
    <div id="progressBar" class="progress indeterminate"><div></div></div>
    <pre id="logBox" class="log"></pre>
    <div id="results" class="results"></div>
  </section>
</main>

<footer>
  <p>输出写入输入目录下的 <code>avit_out\</code>（本地版）· 全程本地处理，不上传数据</p>
  <p id="footLinks"></p>
</footer>

<!-- 浏览文件夹/文件 弹窗 -->
<div id="browseModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">选择文件或文件夹</div>
    <div class="row">
      <input id="bmPath" type="text" spellcheck="false" placeholder="输入路径后回车">
      <button id="bmGo" class="btn ghost">转到</button>
      <button id="bmUp" class="btn ghost">上级</button>
    </div>
    <div id="bmDrives" class="drives"></div>
    <div id="bmList" class="bm-list"></div>
    <div class="modal-actions">
      <span id="bmCwd" class="dim"></span>
      <button id="bmPickDir" class="btn ghost">选择当前文件夹</button>
      <button id="bmClose" class="btn ghost">取消</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
